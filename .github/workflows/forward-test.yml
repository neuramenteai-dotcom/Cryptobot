# Test in avanti (paper) di Unibot: gira da solo ogni giorno nel cloud, nessun ordine reale.
# Il report va sul ramo "forward-reports" (non su main: cosi' Render non riparte ogni giorno)
# e come commento su una segnalazione GitHub, che GitHub manda per email al proprietario.
name: forward-test
on:
  schedule:
    - cron: "40 5 * * *"     # avvio principale: circa le 07:40 in Italia, dopo la chiusura USA e la candela crypto del giorno
    - cron: "40 17 * * *"    # rete di sicurezza: se l'avvio del mattino e' stato saltato o ritardato, recupera (non fa nulla se il report di oggi c'e' gia')
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: forward-test
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNIBOT_FORWARD_START: "2026-10-16"
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il ramo dei report
        run: |
          if git ls-remote --exit-code --heads origin forward-reports >/dev/null 2>&1; then
            git fetch origin forward-reports
            git worktree add reports forward-reports
          else
            git worktree add --detach reports
            (cd reports && git checkout --orphan forward-reports && git rm -rf . >/dev/null 2>&1 || true)
          fi
      - name: Report di oggi gia' presente?
        id: today
        run: |
          if [ -f "reports/history/$(date -u +%F).md" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Report di oggi gia' fatto: niente da fare."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.today.outputs.done == 'false'
        with:
          python-version: "3.11"
      - if: steps.today.outputs.done == 'false'
        run: pip install numpy pandas requests ccxt==4.5.59 python-dotenv
      - name: Calcola il report (tentativi in caso di rete)
        if: steps.today.outputs.done == 'false'
        run: |
          for i in 1 2 3; do
            python -m unibot.run --etf-forward --forward-out reports && exit 0
            sleep 30
          done
          exit 1
      - name: Riepilogo
        if: steps.today.outputs.done == 'false'
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Salva il report sul ramo forward-reports
        if: steps.today.outputs.done == 'false'
        working-directory: reports
        run: |
          git config user.name "unibot-forward"
          git config user.email "unibot-forward@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Report test in avanti $(date -u +%F)"
          git push origin HEAD:forward-reports
      - name: Avviso su GitHub (email automatica)
        if: steps.today.outputs.done == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Report giornaliero test in avanti"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body-file reports/latest.md
          else
            gh issue comment "$num" --body-file reports/latest.md
          fi
          if grep -q "SEGNALE CAMBIATO" reports/latest.md; then
            gh issue create --title "SEGNALE CAMBIATO $(date -u +%F)" --body-file reports/latest.md
          fi
